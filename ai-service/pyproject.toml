[project]
name = "edu-ai-service"
version = "1.0.0"
description = "Private Python 3.12 FastAPI Document Intelligence and AI Generation Service for EduAI Ecosystem"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.8",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "httpx>=0.28.1",
    "pymupdf>=1.25.3",
    "python-docx>=1.1.2",
    "python-pptx>=1.0.2",
    "google-genai>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
