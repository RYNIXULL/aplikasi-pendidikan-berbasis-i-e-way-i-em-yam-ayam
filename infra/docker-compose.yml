services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: edu_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edu_ai_db}
      POSTGRES_USER: ${POSTGRES_USER:-edu_ai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edu_ai_user} -d ${POSTGRES_DB:-edu_ai_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edu_ai_internal

  redis:
    image: redis:7-alpine
    container_name: edu_ai_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - edu_ai_internal

  minio:
    image: rustfs/rustfs:latest
    container_name: edu_ai_s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - edu_ai_internal

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: edu_ai_python
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN is required}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET:?INTERNAL_HMAC_SECRET is required}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL_FAST: ${GEMINI_MODEL_FAST:-gemini-2.5-flash}
      GEMINI_MODEL_QUALITY: ${GEMINI_MODEL_QUALITY:-gemini-2.5-pro}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-text-embedding-004}
      OCR_ENABLED: ${OCR_ENABLED:-false}
    # Intentionally NOT published to host public interface; internal Docker network only
    expose:
      - "8000"
    networks:
      - edu_ai_internal

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: edu_ai_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      ai-service:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-edu_ai_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-edu_ai_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET_NAME:-edu-ai-private}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_PEPPER: ${JWT_REFRESH_PEPPER:?JWT_REFRESH_PEPPER is required}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - edu_ai_internal

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: edu_ai_worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      ai-service:
        condition: service_started
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-edu_ai_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-edu_ai_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET_NAME:-edu-ai-private}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FORCE_PATH_STYLE: "true"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_PEPPER: ${JWT_REFRESH_PEPPER}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      INTERNAL_HMAC_SECRET: ${INTERNAL_HMAC_SECRET}
    networks:
      - edu_ai_internal

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  edu_ai_internal:
    driver: bridge
